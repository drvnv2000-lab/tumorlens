[project]
name = "tumorlens"
version = "1.0.0"
description = "Reproducible feasibility and measurement utilities for longitudinal glioblastoma MRI research"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "nibabel", "matplotlib"]

[project.scripts]
tumorlens = "tumorlens.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["prototype-import", ".vendor"]

